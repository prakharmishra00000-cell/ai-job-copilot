# ==============================================
# JobPilot AI - Render Deployment
# ==============================================
# 
# ZERO SETUP REQUIRED!
# Just deploy and start using.
#
# Optional: Add GOOGLE_AI_API_KEY for AI features
# Get free key: https://aistudio.google.com/apikey
# ==============================================

services:
  - type: web
    name: jobpilot-ai
    runtime: node
    region: oregon
    plan: free
    buildCommand: npm install && npx drizzle-kit push --force && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: NEXT_PUBLIC_APP_URL
        value: https://jobpilot-ai.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: jobpilot-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true
      # ========================================
      # OPTIONAL: Google Gemini AI (FREE)
      # Get key at: https://aistudio.google.com/apikey
      # Enables: AI cover letters, smart matching
      # App works WITHOUT this key too!
      # ========================================
      - key: GOOGLE_AI_API_KEY
        sync: false

databases:
  - name: jobpilot-db
    region: oregon
    plan: free
    databaseName: jobpilot
    user: jobpilot
