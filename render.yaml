# Render Blueprint - JobPilot AI
# Auto-deploys when you push to GitHub

services:
  - type: web
    name: jobpilot-ai
    runtime: node
    region: oregon
    plan: free
    buildCommand: npm install && npx drizzle-kit push --force && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: NEXT_PUBLIC_APP_URL
        value: https://jobpilot-ai.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: jobpilot-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true
      # Google Gemini AI - Get free key at https://aistudio.google.com/apikey
      - key: GOOGLE_AI_API_KEY
        sync: false
      # Optional: Adzuna API for more job sources
      - key: ADZUNA_APP_ID
        sync: false
      - key: ADZUNA_APP_KEY
        sync: false

databases:
  - name: jobpilot-db
    region: oregon
    plan: free
    databaseName: jobpilot
    user: jobpilot
